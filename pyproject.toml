[project]
name = "sim2real-engine"
version = "0.1.0"
description = "Hexagonal Sim-to-Real Data Engine: Deterministic MuJoCo 4.0 Physics, Hugging Face LeRobot v2 Datasets & Closed-Loop Action-Chunked Policy Distillation"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Alexander Leano" }]
keywords = [
    "robotics",
    "embodied-ai",
    "sim2real",
    "mujoco",
    "lerobot",
    "imitation-learning",
    "action-chunking",
    "domain-randomization",
    "hexagonal-architecture",
    "isaac-lab",
    "openpi",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mujoco>=4.0.0",
    "numpy>=2.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.9",
    "torch>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/LeanoA/sim2real-data-engine"
Repository = "https://github.com/LeanoA/sim2real-data-engine.git"
Documentation = "https://github.com/LeanoA/sim2real-data-engine/blob/main/ARTICLE_DRAFT.md"

[project.scripts]
sim2real = "sim2real_engine.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim2real_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --maxfail=1"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["sim2real_engine"]

[[tool.mypy.overrides]]
module = [
    "mujoco",
    "mujoco.viewer",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true
